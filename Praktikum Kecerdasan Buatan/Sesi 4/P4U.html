<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe AI Engine - Sesi 4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Container Card Utama: Hitam-Putih, Flat, Proporsional */
    #tictactoe-root {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 4px;
      padding: 24px;
      width: 100%;
      max-width: 460px;
    }

    /* Header Minimalis */
    .header {
      border-bottom: 1px solid #27272a;
      padding-bottom: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #71717a;
      font-weight: 700;
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fafafa;
      margin-top: 2px;
    }
    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 2px;
      color: #fafafa;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    /* Form Kontrol Dropdown */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a1a1aa;
      display: block;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      background: #18181b;
      color: #fafafa;
      border: 1px solid #27272a;
      padding: 9px 12px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    select:focus {
      border-color: #71717a;
    }

    /* Papan Permainan Proporsional & Solid */
    .board-wrapper {
      width: 100%;
      margin: 16px 0 20px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #18181b;
      padding: 8px;
      border: 1px solid #27272a;
      border-radius: 4px;
      aspect-ratio: 1 / 1;
      width: 100%;
    }
    .cell-btn {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 2px;
      font-size: clamp(38px, 10vw, 56px);
      font-weight: 800;
      color: #fafafa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.15s ease, border-color 0.15s ease;
      line-height: 1;
    }
    .cell-btn:hover:not(:disabled) {
      background: #1c1c20;
      border-color: #52525b;
    }
    .cell-btn:disabled {
      cursor: default;
    }

    /* Animasi Pop-in Halus Saat Langkah Ditaruh */
    @keyframes popIn {
      0% {
        transform: scale(0.65);
        opacity: 0;
      }
      70% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
    .mark-anim {
      display: inline-block;
      animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Simbol Monokrom: Putih Bersih (O) & Abu-abu Terang (X) */
    .mark-o { color: #ffffff; }
    .mark-x { color: #d4d4d8; }

    /* Highlight Petak Pemenang */
    .cell-win {
      background: #27272a !important;
      border-color: #ffffff !important;
    }

    /* Status Text */
    .message {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      min-height: 24px;
      color: #d4d4d8;
      margin-bottom: 20px;
      letter-spacing: -0.2px;
    }

    /* Tombol Aksi */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }
    .action-btn {
      padding: 11px 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      outline: none;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .btn-undo {
      background: #18181b;
      color: #e4e4e7;
      border: 1px solid #27272a;
    }
    .btn-undo:hover {
      background: #27272a;
      border-color: #3f3f46;
    }
    .btn-restart {
      background: #ffffff;
      color: #09090b;
      border: 1px solid #ffffff;
    }
    .btn-restart:hover {
      background: #e4e4e7;
    }
    .btn-reset {
      background: #18181b;
      color: #71717a;
      border: 1px solid #27272a;
    }
    .btn-reset:hover {
      color: #a1a1aa;
      border-color: #3f3f46;
    }

    /* Statistik Pertandingan Monokrom */
    .stats-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 2px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .stats-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #71717a;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      font-size: 11px;
    }
    .stats-grid span {
      color: #71717a;
      font-weight: 600;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 20px;
      font-weight: 800;
      color: #fafafa;
      margin-top: 4px;
    }

    /* Tabel Riwayat Match */
    .history-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 2px;
      padding: 14px 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    th {
      padding: 8px 6px;
      border-bottom: 1px solid #27272a;
      color: #71717a;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
    }
    td {
      padding: 8px 6px;
      border-bottom: 1px solid #202024;
      color: #e4e4e7;
    }
    .tag-win { color: #ffffff; font-weight: 700; }
    .tag-loss { color: #a1a1aa; font-weight: 500; }
    .tag-draw { color: #71717a; font-weight: 600; }
  </style>
</head>
<body>

<div id="tictactoe-root">
  <!-- Header -->
  <div class="header">
    <div>
      <div class="subtitle">Praktikum Kecerdasan Buatan - Sesi 4</div>
      <div class="title">TIC-TAC-TOE ENGINE</div>
    </div>
    <div id="status-pill" class="status-pill">READY</div>
  </div>

  <!-- Pengaturan Mode & Giliran -->
  <div class="controls">
    <div>
      <label>Tingkat Kesulitan</label>
      <select id="diff-select" onchange="restartRound()">
        <option value="easy">Easy (Langkah Acak)</option>
        <option value="medium">Medium (Kedalaman Max 2)</option>
        <option value="hard" selected>Hard (Alpha-Beta / Unbeatable)</option>
      </select>
    </div>
    <div>
      <label>Giliran Pertama</label>
      <select id="turn-select" onchange="restartRound()">
        <option value="human">Manusia (O)</option>
        <option value="bot">Bot (X)</option>
        <option value="random">Acak / Random (50:50)</option>
      </select>
    </div>
  </div>

  <!-- Papan Permainan Proporsional 1:1 -->
  <div class="board-wrapper">
    <div class="grid">
      <button class="cell-btn" data-idx="0" onclick="userMove(0)"></button>
      <button class="cell-btn" data-idx="1" onclick="userMove(1)"></button>
      <button class="cell-btn" data-idx="2" onclick="userMove(2)"></button>
      <button class="cell-btn" data-idx="3" onclick="userMove(3)"></button>
      <button class="cell-btn" data-idx="4" onclick="userMove(4)"></button>
      <button class="cell-btn" data-idx="5" onclick="userMove(5)"></button>
      <button class="cell-btn" data-idx="6" onclick="userMove(6)"></button>
      <button class="cell-btn" data-idx="7" onclick="userMove(7)"></button>
      <button class="cell-btn" data-idx="8" onclick="userMove(8)"></button>
    </div>
  </div>

  <!-- Pesan Giliran / Hasil -->
  <div id="game-message" class="message">Giliran Pemain: Klik salah satu kotak kosong</div>

  <!-- Tombol Aksi -->
  <div class="actions">
    <button class="action-btn btn-undo" onclick="undoMove()">UNDO</button>
    <button class="action-btn btn-restart" onclick="restartRound()">RESTART</button>
    <button class="action-btn btn-reset" onclick="resetStats()">RESET SKOR</button>
  </div>

  <!-- Statistik Rekap -->
  <div class="stats-box">
    <div class="stats-title">Statistik Pertandingan</div>
    <div class="stats-grid">
      <div><span>Menang</span><div id="score-win" class="score-val">0</div></div>
      <div><span>Kalah</span><div id="score-loss" class="score-val">0</div></div>
      <div><span>Seri</span><div id="score-draw" class="score-val">0</div></div>
      <div><span>Total</span><div id="score-total" class="score-val">0</div></div>
    </div>
  </div>

  <!-- Tabel Riwayat Match -->
  <div class="history-box">
    <div class="stats-title">Riwayat Pertandingan Terakhir</div>
    <div style="max-height: 140px; overflow-y: auto;">
      <table>
        <thead>
          <tr>
            <th>Game</th>
            <th>Level</th>
            <th>Awal</th>
            <th>Hasil</th>
            <th>Langkah</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr><td colspan="5" style="text-align: center; color: #52525b; padding: 12px 6px;">Belum ada riwayat permainan</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function() {
  let board = Array(9).fill(' ');
  let historyStack = [];
  let isGameOver = false;
  let moveCount = 0;
  let stats = { win: 0, loss: 0, draw: 0, total: 0 };
  let matchHistory = [];

  const winConditions = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  function checkWinnerState(b) {
    for (let c of winConditions) {
      if (b[c[0]] !== ' ' && b[c[0]] === b[c[1]] && b[c[1]] === b[c[2]]) {
        return { winner: b[c[0]], line: c };
      }
    }
    if (!b.includes(' ')) return { winner: 'DRAW', line: null };

    // Smart Early Draw Detection: Semua 8 garis sudah terblokir oleh X dan O
    let allBlocked = true;
    for (let c of winConditions) {
      let set = new Set([b[c[0]], b[c[1]], b[c[2]]]);
      if (!(set.has('X') && set.has('O'))) {
        allBlocked = false;
        break;
      }
    }
    if (allBlocked) return { winner: 'DRAW', line: null };

    return null;
  }

  function minimaxAB(b, depth, alpha, beta, isMax) {
    let res = checkWinnerState(b);
    if (res) {
      if (res.winner === 'X') return 10 - depth;
      if (res.winner === 'O') return depth - 10;
      if (res.winner === 'DRAW') return 0;
    }

    let empty = [];
    for (let i = 0; i < 9; i++) if (b[i] === ' ') empty.push(i);

    if (isMax) {
      let maxEval = -Infinity;
      for (let m of empty) {
        b[m] = 'X';
        let ev = minimaxAB(b, depth + 1, alpha, beta, false);
        b[m] = ' ';
        maxEval = Math.max(maxEval, ev);
        alpha = Math.max(alpha, ev);
        if (beta <= alpha) break;
      }
      return maxEval;
    } else {
      let minEval = Infinity;
      for (let m of empty) {
        b[m] = 'O';
        let ev = minimaxAB(b, depth + 1, alpha, beta, true);
        b[m] = ' ';
        minEval = Math.min(minEval, ev);
        beta = Math.min(beta, ev);
        if (beta <= alpha) break;
      }
      return minEval;
    }
  }

  function getBestBotMove(diff) {
    let empty = [];
    for (let i = 0; i < 9; i++) if (board[i] === ' ') empty.push(i);
    if (empty.length === 0) return -1;

    if (diff === 'easy') {
      return empty[Math.floor(Math.random() * empty.length)];
    } else if (diff === 'medium') {
      let bestS = -Infinity, bestM = empty[0];
      for (let m of empty) {
        board[m] = 'X';
        let s = minimaxAB(board, 2, -Infinity, Infinity, false);
        board[m] = ' ';
        if (s > bestS) { bestS = s; bestM = m; }
      }
      return bestM;
    } else {
      let bestS = -Infinity, bestM = empty[0];
      for (let m of empty) {
        board[m] = 'X';
        let s = minimaxAB(board, 0, -Infinity, Infinity, false);
        board[m] = ' ';
        if (s > bestS) { bestS = s; bestM = m; }
      }
      return bestM;
    }
  }

  function updateDOM(winLine = null) {
    for (let i = 0; i < 9; i++) {
      let btn = document.querySelector(`.cell-btn[data-idx="${i}"]`);
      if (btn) {
        if (board[i] !== ' ') {
          btn.innerHTML = `<span class="mark-anim ${board[i] === 'O' ? 'mark-o' : 'mark-x'}">${board[i]}</span>`;
        } else {
          btn.innerHTML = '';
        }
        btn.disabled = board[i] !== ' ' || isGameOver;
        if (winLine && winLine.includes(i)) {
          btn.classList.add('cell-win');
        } else {
          btn.classList.remove('cell-win');
        }
      }
    }
  }

  function finalizeGame(resultObj) {
    isGameOver = true;
    updateDOM(resultObj.line);

    let resText = '';
    let pill = document.getElementById('status-pill');
    let msg = document.getElementById('game-message');

    if (resultObj.winner === 'DRAW') {
      stats.draw++;
      resText = 'Seri (Draw)';
      pill.textContent = 'DRAW';
      msg.textContent = 'Hasil Akhir: Seri (Semua garis kemenangan terblokir)';
    } else if (resultObj.winner === 'X') {
      stats.loss++;
      resText = 'Bot Menang';
      pill.textContent = 'DEFEAT';
      msg.textContent = 'Hasil Akhir: Bot Menang!';
    } else {
      stats.win++;
      resText = 'Kamu Menang';
      pill.textContent = 'VICTORY';
      msg.textContent = 'Hasil Akhir: Selamat, Kamu Menang!';
    }
    stats.total++;

    document.getElementById('score-win').textContent = stats.win;
    document.getElementById('score-loss').textContent = stats.loss;
    document.getElementById('score-draw').textContent = stats.draw;
    document.getElementById('score-total').textContent = stats.total;

    let diff = document.getElementById('diff-select').value.toUpperCase();
    let turnChoice = document.getElementById('turn-select').value;
    let first = turnChoice === 'bot' ? 'Bot' : 'Manusia';

    matchHistory.unshift({
      gameNo: stats.total,
      diff: diff,
      first: first,
      res: resText,
      moves: moveCount
    });

    renderHistory();
  }

  function renderHistory() {
    let tbody = document.getElementById('history-body');
    if (!tbody) return;
    if (matchHistory.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #52525b; padding: 12px 6px;">Belum ada riwayat permainan</td></tr>';
      return;
    }
    tbody.innerHTML = matchHistory.slice(0, 5).map(m => `
      <tr>
        <td style="font-weight: 700;">#${m.gameNo}</td>
        <td style="color: #a1a1aa;">${m.diff}</td>
        <td style="color: #a1a1aa;">${m.first}</td>
        <td class="${m.res.includes('Kamu') ? 'tag-win' : (m.res.includes('Bot') ? 'tag-loss' : 'tag-draw')}">${m.res}</td>
        <td style="color: #71717a;">${m.moves}</td>
      </tr>
    `).join('');
  }

  window.userMove = function(idx) {
    if (isGameOver || board[idx] !== ' ') return;

    historyStack.push([...board]);
    board[idx] = 'O';
    moveCount++;
    updateDOM();

    let res = checkWinnerState(board);
    if (res) { finalizeGame(res); return; }

    document.getElementById('game-message').textContent = 'Bot sedang berpikir...';
    document.getElementById('status-pill').textContent = 'BOT TURN';

    setTimeout(() => {
      let diff = document.getElementById('diff-select').value;
      let bMove = getBestBotMove(diff);
      if (bMove !== -1) {
        board[bMove] = 'X';
        moveCount++;
        updateDOM();
      }

      let res2 = checkWinnerState(board);
      if (res2) {
        finalizeGame(res2);
      } else {
        document.getElementById('game-message').textContent = 'Giliranmu: Pilih kotak kosong (O)';
        document.getElementById('status-pill').textContent = 'YOUR TURN';
      }
    }, 140);
  };

  window.undoMove = function() {
    if (historyStack.length === 0 || isGameOver) return;
    board = historyStack.pop();
    moveCount = Math.max(0, moveCount - 2);
    isGameOver = false;
    document.getElementById('status-pill').textContent = 'YOUR TURN';
    document.getElementById('game-message').textContent = 'Langkah terakhir dibatalkan (Undo)';
    updateDOM();
  };

  window.restartRound = function() {
    board = Array(9).fill(' ');
    historyStack = [];
    isGameOver = false;
    moveCount = 0;

    let turnChoice = document.getElementById('turn-select').value;
    let starter = 'O';
    if (turnChoice === 'bot') starter = 'X';
    else if (turnChoice === 'random') starter = Math.random() < 0.5 ? 'O' : 'X';

    updateDOM();

    if (starter === 'X') {
      document.getElementById('status-pill').textContent = 'BOT FIRST';
      document.getElementById('game-message').textContent = 'Bot melangkah pertama...';
      setTimeout(() => {
        let diff = document.getElementById('diff-select').value;
        let bMove = getBestBotMove(diff);
        if (bMove !== -1) {
          board[bMove] = 'X';
          moveCount++;
          updateDOM();
        }
        document.getElementById('status-pill').textContent = 'YOUR TURN';
        document.getElementById('game-message').textContent = 'Giliranmu: Pilih kotak kosong (O)';
      }, 160);
    } else {
      document.getElementById('status-pill').textContent = 'YOUR TURN';
      document.getElementById('game-message').textContent = 'Giliranmu jalan pertama: Pilih kotak (O)';
    }
  };

  window.resetStats = function() {
    stats = { win: 0, loss: 0, draw: 0, total: 0 };
    matchHistory = [];
    document.getElementById('score-win').textContent = '0';
    document.getElementById('score-loss').textContent = '0';
    document.getElementById('score-draw').textContent = '0';
    document.getElementById('score-total').textContent = '0';
    renderHistory();
  };

  window.restartRound();
})();
</script>
</body>
</html>
