<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe AI Engine - Praktikum Sesi 4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #tictactoe-root {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 24px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      border-bottom: 1px solid #334155;
      padding-bottom: 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 700;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2px;
    }
    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 2px;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      display: block;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 9px 10px;
      border-radius: 2px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .board-container {
      display: flex;
      justify-content: center;
      margin: 18px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-template-rows: repeat(3, 90px);
      gap: 8px;
      background: #1e293b;
      padding: 8px;
      border: 1px solid #334155;
      border-radius: 4px;
    }
    .cell-btn {
      width: 90px;
      height: 90px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 2px;
      font-size: 34px;
      font-weight: 700;
      color: #f8fafc;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cell-btn:hover:not(:disabled) {
      background: #1e293b;
      border-color: #64748b;
    }
    .cell-btn:disabled {
      cursor: default;
    }
    .cell-btn.mark-o { color: #38bdf8; }
    .cell-btn.mark-x { color: #f43f5e; }
    .message {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      min-height: 22px;
      color: #cbd5e1;
      margin-bottom: 16px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .action-btn {
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      outline: none;
    }
    .btn-undo {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
    }
    .btn-restart {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #1d4ed8;
    }
    .btn-reset {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .stats-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 2px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .stats-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      font-size: 12px;
    }
    .score-val {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
    }
    .history-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 2px;
      padding: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    th {
      padding: 6px;
      border-bottom: 1px solid #334155;
      color: #94a3b8;
      font-weight: 600;
    }
    td {
      padding: 6px;
      border-bottom: 1px solid #243248;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

<div id="tictactoe-root">
  <div class="header">
    <div>
      <div class="subtitle">Praktikum Kecerdasan Buatan - Sesi 4</div>
      <div class="title">TIC-TAC-TOE ENGINE</div>
    </div>
    <div id="status-pill" class="status-pill">READY</div>
  </div>

  <div class="controls">
    <div>
      <label>Tingkat Kesulitan</label>
      <select id="diff-select">
        <option value="easy">Easy (Langkah Acak)</option>
        <option value="medium">Medium (Kedalaman Max 2)</option>
        <option value="hard" selected>Hard (Alpha-Beta / Unbeatable)</option>
      </select>
    </div>
    <div>
      <label>Giliran Pertama</label>
      <select id="turn-select">
        <option value="human">Manusia (O)</option>
        <option value="bot">Bot (X)</option>
        <option value="random">Acak / Random (50:50)</option>
      </select>
    </div>
  </div>

  <div class="board-container">
    <div class="grid">
      <button class="cell-btn" data-idx="0" onclick="userMove(0)"></button>
      <button class="cell-btn" data-idx="1" onclick="userMove(1)"></button>
      <button class="cell-btn" data-idx="2" onclick="userMove(2)"></button>
      <button class="cell-btn" data-idx="3" onclick="userMove(3)"></button>
      <button class="cell-btn" data-idx="4" onclick="userMove(4)"></button>
      <button class="cell-btn" data-idx="5" onclick="userMove(5)"></button>
      <button class="cell-btn" data-idx="6" onclick="userMove(6)"></button>
      <button class="cell-btn" data-idx="7" onclick="userMove(7)"></button>
      <button class="cell-btn" data-idx="8" onclick="userMove(8)"></button>
    </div>
  </div>

  <div id="game-message" class="message">Giliran Pemain: Klik salah satu kotak kosong</div>

  <div class="actions">
    <button class="action-btn btn-undo" onclick="undoMove()">UNDO</button>
    <button class="action-btn btn-restart" onclick="restartRound()">RESTART</button>
    <button class="action-btn btn-reset" onclick="resetStats()">RESET SKOR</button>
  </div>

  <div class="stats-box">
    <div class="stats-title">Statistik Pertandingan</div>
    <div class="stats-grid">
      <div><span style="color: #94a3b8;">Menang</span><div id="score-win" class="score-val" style="color: #22c55e;">0</div></div>
      <div><span style="color: #94a3b8;">Kalah</span><div id="score-loss" class="score-val" style="color: #ef4444;">0</div></div>
      <div><span style="color: #94a3b8;">Seri</span><div id="score-draw" class="score-val" style="color: #f59e0b;">0</div></div>
      <div><span style="color: #94a3b8;">Total</span><div id="score-total" class="score-val" style="color: #f8fafc;">0</div></div>
    </div>
  </div>

  <div class="history-box">
    <div class="stats-title">Riwayat Pertandingan Terakhir</div>
    <div style="max-height: 140px; overflow-y: auto;">
      <table>
        <thead>
          <tr>
            <th>Game</th>
            <th>Level</th>
            <th>Awal</th>
            <th>Hasil</th>
            <th>Langkah</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr><td colspan="5" style="text-align: center; color: #64748b; padding: 10px;">Belum ada riwayat permainan</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function() {
  let board = Array(9).fill(' ');
  let historyStack = [];
  let isGameOver = false;
  let moveCount = 0;
  let stats = { win: 0, loss: 0, draw: 0, total: 0 };
  let matchHistory = [];

  const winConditions = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  function checkWinnerState(b) {
    for (let c of winConditions) {
      if (b[c[0]] !== ' ' && b[c[0]] === b[c[1]] && b[c[1]] === b[c[2]]) {
        return b[c[0]];
      }
    }
    if (!b.includes(' ')) return 'DRAW';

    let allBlocked = true;
    for (let c of winConditions) {
      let set = new Set([b[c[0]], b[c[1]], b[c[2]]]);
      if (!(set.has('X') && set.has('O'))) {
        allBlocked = false;
        break;
      }
    }
    if (allBlocked) return 'DRAW';
    return null;
  }

  function minimaxAB(b, depth, alpha, beta, isMax) {
    let w = checkWinnerState(b);
    if (w === 'X') return 10 - depth;
    if (w === 'O') return depth - 10;
    if (w === 'DRAW') return 0;

    let empty = [];
    for (let i = 0; i < 9; i++) if (b[i] === ' ') empty.push(i);

    if (isMax) {
      let maxEval = -Infinity;
      for (let m of empty) {
        b[m] = 'X';
        let ev = minimaxAB(b, depth + 1, alpha, beta, false);
        b[m] = ' ';
        maxEval = Math.max(maxEval, ev);
        alpha = Math.max(alpha, ev);
        if (beta <= alpha) break;
      }
      return maxEval;
    } else {
      let minEval = Infinity;
      for (let m of empty) {
        b[m] = 'O';
        let ev = minimaxAB(b, depth + 1, alpha, beta, true);
        b[m] = ' ';
        minEval = Math.min(minEval, ev);
        beta = Math.min(beta, ev);
        if (beta <= alpha) break;
      }
      return minEval;
    }
  }

  function getBestBotMove(diff) {
    let empty = [];
    for (let i = 0; i < 9; i++) if (board[i] === ' ') empty.push(i);
    if (empty.length === 0) return -1;

    if (diff === 'easy') {
      return empty[Math.floor(Math.random() * empty.length)];
    } else if (diff === 'medium') {
      let bestS = -Infinity, bestM = empty[0];
      for (let m of empty) {
        board[m] = 'X';
        let s = minimaxAB(board, 2, -Infinity, Infinity, false);
        board[m] = ' ';
        if (s > bestS) { bestS = s; bestM = m; }
      }
      return bestM;
    } else {
      let bestS = -Infinity, bestM = empty[0];
      for (let m of empty) {
        board[m] = 'X';
        let s = minimaxAB(board, 0, -Infinity, Infinity, false);
        board[m] = ' ';
        if (s > bestS) { bestS = s; bestM = m; }
      }
      return bestM;
    }
  }

  function updateDOM() {
    for (let i = 0; i < 9; i++) {
      let btn = document.querySelector(`.cell-btn[data-idx="${i}"]`);
      if (btn) {
        btn.textContent = board[i] === ' ' ? '' : board[i];
        btn.className = 'cell-btn ' + (board[i] === 'O' ? 'mark-o' : (board[i] === 'X' ? 'mark-x' : ''));
        btn.disabled = board[i] !== ' ' || isGameOver;
      }
    }
  }

  function finalizeGame(winner) {
    isGameOver = true;
    updateDOM();
    let resText = '';
    let pill = document.getElementById('status-pill');
    let msg = document.getElementById('game-message');

    if (winner === 'DRAW') {
      stats.draw++;
      resText = 'Seri (Draw)';
      pill.textContent = 'DRAW';
      pill.style.color = '#f59e0b';
      msg.textContent = 'Hasil Akhir: Seri (Semua garis kemenangan terblokir)';
    } else if (winner === 'X') {
      stats.loss++;
      resText = 'Bot Menang';
      pill.textContent = 'DEFEAT';
      pill.style.color = '#ef4444';
      msg.textContent = 'Hasil Akhir: Bot Menang!';
    } else {
      stats.win++;
      resText = 'Kamu Menang';
      pill.textContent = 'VICTORY';
      pill.style.color = '#22c55e';
      msg.textContent = 'Hasil Akhir: Kamu Menang!';
    }
    stats.total++;

    document.getElementById('score-win').textContent = stats.win;
    document.getElementById('score-loss').textContent = stats.loss;
    document.getElementById('score-draw').textContent = stats.draw;
    document.getElementById('score-total').textContent = stats.total;

    let diff = document.getElementById('diff-select').value.toUpperCase();
    let turnChoice = document.getElementById('turn-select').value;
    let first = turnChoice === 'bot' ? 'Bot' : 'Manusia';
    matchHistory.unshift({
      gameNo: stats.total,
      diff: diff,
      first: first,
      res: resText,
      moves: moveCount
    });

    renderHistory();
  }

  function renderHistory() {
    let tbody = document.getElementById('history-body');
    if (!tbody) return;
    if (matchHistory.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b; padding: 10px;">Belum ada riwayat permainan</td></tr>';
      return;
    }
    tbody.innerHTML = matchHistory.slice(0, 5).map(m => `
      <tr>
        <td style="font-weight: 600;">#${m.gameNo}</td>
        <td style="color: #94a3b8;">${m.diff}</td>
        <td style="color: #94a3b8;">${m.first}</td>
        <td style="font-weight: 600; color: ${m.res.includes('Kamu') ? '#22c55e' : (m.res.includes('Bot') ? '#ef4444' : '#f59e0b')};">${m.res}</td>
        <td style="color: #94a3b8;">${m.moves}</td>
      </tr>
    `).join('');
  }

  window.userMove = function(idx) {
    if (isGameOver || board[idx] !== ' ') return;

    historyStack.push([...board]);
    board[idx] = 'O';
    moveCount++;
    updateDOM();

    let w = checkWinnerState(board);
    if (w) { finalizeGame(w); return; }

    document.getElementById('game-message').textContent = 'Bot sedang berpikir...';
    document.getElementById('status-pill').textContent = 'BOT TURN';
    document.getElementById('status-pill').style.color = '#f43f5e';

    setTimeout(() => {
      let diff = document.getElementById('diff-select').value;
      let bMove = getBestBotMove(diff);
      if (bMove !== -1) {
        board[bMove] = 'X';
        moveCount++;
        updateDOM();
      }

      let w2 = checkWinnerState(board);
      if (w2) {
        finalizeGame(w2);
      } else {
        document.getElementById('game-message').textContent = 'Giliranmu: Pilih kotak kosong (O)';
        document.getElementById('status-pill').textContent = 'YOUR TURN';
        document.getElementById('status-pill').style.color = '#38bdf8';
      }
    }, 120);
  };

  window.undoMove = function() {
    if (historyStack.length === 0 || isGameOver) return;
    board = historyStack.pop();
    moveCount = Math.max(0, moveCount - 2);
    isGameOver = false;
    document.getElementById('status-pill').textContent = 'YOUR TURN';
    document.getElementById('status-pill').style.color = '#38bdf8';
    document.getElementById('game-message').textContent = 'Langkah terakhir dibatalkan (Undo)';
    updateDOM();
  };

  window.restartRound = function() {
    board = Array(9).fill(' ');
    historyStack = [];
    isGameOver = false;
    moveCount = 0;

    let turnChoice = document.getElementById('turn-select').value;
    let starter = 'O';
    if (turnChoice === 'bot') starter = 'X';
    else if (turnChoice === 'random') starter = Math.random() < 0.5 ? 'O' : 'X';

    updateDOM();

    if (starter === 'X') {
      document.getElementById('status-pill').textContent = 'BOT FIRST';
      document.getElementById('status-pill').style.color = '#f43f5e';
      document.getElementById('game-message').textContent = 'Bot melangkah pertama...';
      setTimeout(() => {
        let diff = document.getElementById('diff-select').value;
        let bMove = getBestBotMove(diff);
        if (bMove !== -1) {
          board[bMove] = 'X';
          moveCount++;
          updateDOM();
        }
        document.getElementById('status-pill').textContent = 'YOUR TURN';
        document.getElementById('status-pill').style.color = '#38bdf8';
        document.getElementById('game-message').textContent = 'Giliranmu: Pilih kotak kosong (O)';
      }, 150);
    } else {
      document.getElementById('status-pill').textContent = 'YOUR TURN';
      document.getElementById('status-pill').style.color = '#38bdf8';
      document.getElementById('game-message').textContent = 'Giliranmu jalan pertama: Pilih kotak (O)';
    }
  };

  window.resetStats = function() {
    stats = { win: 0, loss: 0, draw: 0, total: 0 };
    matchHistory = [];
    document.getElementById('score-win').textContent = '0';
    document.getElementById('score-loss').textContent = '0';
    document.getElementById('score-draw').textContent = '0';
    document.getElementById('score-total').textContent = '0';
    renderHistory();
  };

  window.restartRound();
})();
</script>
</body>
</html>
